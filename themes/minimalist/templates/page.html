{% extends "base.html" %}

{% block title %}{% if page.save_as == 'index.html' %}{{ SITENAME }}{% else %}{{ page.title }} - {{ SITENAME }}{% endif %}{% endblock %}

{% block content %}
    <article class="page-{{ page.slug }}">
        {% if page.save_as != 'index.html' %}<h2>{{ page.title }}</h2>{% endif %}
        {{ page.content }}
    </article>
{% endblock %}
