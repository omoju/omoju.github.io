{% extends "base.html" %}

{% block title %}{{ article.title }} - {{ SITENAME }}{% endblock %}

{% block content %}
    <article>
        <h2 class="entry-title">{{ article.title }}</h2>
        <div class="date">{{ article.date.strftime('%B %d, %Y') }}</div>
        <div class="post-body article-body">{{ article.content }}</div>
    </article>
{% endblock %}
